<html lang="fr">

<style>
  @font-face { font-family: "Manrope"; font-style: normal; font-weight: 400 800; font-display: swap; src: url(/synerglace/manrope.woff2) format("woff2"); }
  :root {
    --bg: #041225; --bg2: #06182f; --txt: #f2f7ff; --mut: #93a8c6; --dim: #5d7598;
    --verre: rgba(255,255,255,.055); --verre2: rgba(255,255,255,.09); --bord: rgba(255,255,255,.10); --bord2: rgba(255,255,255,.18);
    --ice: #8fd8ff; --ice2: #4fb3ff; --rouge: #ff4d61; --orange: #ffb547; --vert: #3ee39a;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--txt); background: var(--bg); font: 500 16px/1.45 "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: calc(28px + var(--safe-b)); overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

  /* Fond : aurore + neige */
  .aurore { position: fixed; inset: 0 0 auto 0; height: 560px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 55% at 15% 0%, rgba(79,179,255,.30), transparent 70%),
      radial-gradient(50% 45% at 90% 8%, rgba(150,120,255,.22), transparent 70%),
      radial-gradient(70% 40% at 50% 35%, rgba(70,220,255,.10), transparent 75%); }
  #neige { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; -webkit-mask-image: linear-gradient(#000 0, #000 30%, transparent 75%); mask-image: linear-gradient(#000 0, #000 30%, transparent 75%); }

  /* En-tête */
  header { position: sticky; top: 0; z-index: 30; padding-top: var(--safe-t); transition: background .3s, box-shadow .3s; }
  header.colle { background: rgba(4,18,37,.72); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 1px 0 var(--bord); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 60px; }
  .top img { height: 36px; width: auto; display: block; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 999px; background: var(--verre2); border: 1px solid var(--bord); font-size: 13px; font-weight: 700; color: var(--txt); white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .pill svg.i { width: 15px; height: 15px; color: var(--ice); }
  .pill .chev { width: 13px; height: 13px; color: var(--mut); }

  /* Vues */
  #vue > * { animation: entre .45s var(--ease) both; }
  #vue > *:nth-child(2) { animation-delay: .04s; } #vue > *:nth-child(3) { animation-delay: .08s; } #vue > *:nth-child(4) { animation-delay: .12s; }
  #vue > *:nth-child(5) { animation-delay: .16s; } #vue > *:nth-child(6) { animation-delay: .2s; } #vue > *:nth-child(n+7) { animation-delay: .24s; }
  @keyframes entre { from { opacity: 0; transform: translateY(14px); } }

  .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ice); }
  h2.sec { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); margin: 28px 2px 12px; }
  h2.sec span { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--dim); font-size: 12px; }

  /* Héro */
  .hero { position: relative; margin-top: 6px; border-radius: 26px; padding: 20px 20px 18px; overflow: hidden;
    background: linear-gradient(160deg, rgba(143,216,255,.16), rgba(143,216,255,.03) 55%), rgba(255,255,255,.03);
    border: 1px solid var(--bord2); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 50px -20px rgba(0,0,0,.6); }
  .hero h1 { margin: 6px 0 0; font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .hero .adr { color: var(--mut); font-size: 13.5px; margin-top: 4px; }
  .piste-svg { display: block; width: 100%; height: auto; margin: 16px 0 14px; }
  .trace { stroke-dasharray: 6 9; animation: glisse 6s linear infinite; }
  .trace.b { animation-duration: 9s; animation-direction: reverse; }
  @keyframes glisse { to { stroke-dashoffset: -150; } }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; }
  .puce { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(4,18,37,.45); border: 1px solid var(--bord); font-size: 12px; font-weight: 700; color: var(--mut); }
  .puce.ok { color: var(--vert); } .puce.ok i { width: 7px; height: 7px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 3px rgba(62,227,154,.2); }

  /* Urgences */
  .sos { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1d6fd8 0%, #0d4597 55%, #0a3576 100%); border: 1px solid rgba(143,216,255,.4); box-shadow: 0 16px 40px -14px rgba(29,111,216,.65), inset 0 1px 0 rgba(255,255,255,.25); }
  .sos::after { content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 65%); }
  .sos .t { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .sos small { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .sos b { display: block; font-size: 19px; font-weight: 800; margin-top: 2px; letter-spacing: -.01em; }
  .sos .num { font-size: 13.5px; color: rgba(255,255,255,.8); font-variant-numeric: tabular-nums; }
  .rond { position: relative; z-index: 1; flex: none; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: #0d4597; display: grid; place-items: center; }
  .rond::before, .rond::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); animation: onde 2.4s var(--ease) infinite; }
  .rond::after { animation-delay: 1.2s; }
  @keyframes onde { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
  .urg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .urg3 a, .urg3 button { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 12px 13px; border-radius: 20px; background: var(--verre); border: 1px solid var(--bord); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .urg3 .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .urg3 b { font-size: 14px; font-weight: 800; line-height: 1.15; }
  .urg3 small { display: block; font-size: 11px; color: var(--mut); margin-top: 2px; font-weight: 600; }
  .urg3 .rge { background: linear-gradient(160deg, rgba(255,77,97,.28), rgba(255,77,97,.10)); border-color: rgba(255,77,97,.45); }
  .press { transition: transform .15s var(--ease); } .press:active { transform: scale(.97); }

  /* Recherche */
  .cherche { position: relative; }
  .cherche input { width: 100%; height: 58px; border-radius: 18px; border: 1px solid var(--bord2); background: rgba(255,255,255,.07); color: var(--txt); font: inherit; font-size: 17px; font-weight: 600; padding: 0 48px 0 52px; outline: none; -webkit-appearance: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); transition: border-color .2s, box-shadow .2s, background .2s; }
  .cherche input:focus { border-color: var(--ice); background: rgba(143,216,255,.08); box-shadow: 0 0 0 4px rgba(143,216,255,.14); }
  .cherche input::placeholder { color: var(--dim); font-weight: 500; }
  .cherche input::-webkit-search-cancel-button { display: none; }
  .cherche .loupe { position: absolute; left: 17px; top: 18px; color: var(--ice); pointer-events: none; }
  .cherche .eff { position: absolute; right: 9px; top: 9px; width: 40px; height: 40px; border-radius: 12px; color: var(--mut); display: none; place-items: center; background: var(--verre2); }
  .cherche.rempli .eff { display: grid; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 12px 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--verre); border: 1px solid var(--bord); color: var(--mut); font-size: 13px; font-weight: 700; }
  .vide { color: var(--mut); font-size: 15px; padding: 10px 4px 12px; }

  /* Thèmes */
  .tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tuile { position: relative; min-height: 150px; border-radius: 22px; padding: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(255,255,255,.03) 60%) padding-box, linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, transparent), rgba(255,255,255,.06) 50%) border-box;
    border: 1px solid transparent; }
  .tuile .badge { position: absolute; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: 0 0 24px -4px color-mix(in srgb, var(--c) 60%, transparent); }
  .tuile .filigrane { position: absolute; right: -18px; bottom: -18px; width: 110px; height: 110px; color: var(--c); opacity: .09; stroke-width: 1.5; }
  .tuile .nb { position: absolute; top: 18px; right: 16px; font-size: 12px; font-weight: 800; color: var(--c); }
  .tuile b { position: relative; font-size: 17px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .tuile small { position: relative; color: var(--mut); font-size: 12px; line-height: 1.35; margin-top: 4px; font-weight: 600; }

  /* Lignes de fiche */
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .ligne { display: flex; align-items: center; gap: 13px; padding: 13px 14px; border-radius: 18px; background: var(--verre); border: 1px solid var(--bord); width: 100%; }
  .ligne .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); position: relative; }
  .ligne .ic i { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bg); }
  .ligne .t { flex: 1; min-width: 0; }
  .ligne b { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; }
  .ligne small { display: block; color: var(--mut); font-size: 12px; margin-top: 3px; font-weight: 600; }
  .ligne .chev { color: var(--dim); width: 18px; height: 18px; }
  .ligne.urgent { background: linear-gradient(90deg, rgba(255,77,97,.14), rgba(255,77,97,.03)); border-color: rgba(255,77,97,.35); }
  .d-rouge { background: var(--rouge); } .d-orange { background: var(--orange); } .d-vert { background: var(--vert); }

  /* Repères */
  .reperes { border-radius: 22px; background: var(--verre); border: 1px solid var(--bord); overflow: hidden; }
  .reperes summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 16px; cursor: pointer; font-weight: 800; }
  .reperes summary::-webkit-details-marker { display: none; }
  .reperes summary .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(143,216,255,.14); color: var(--ice); }
  .reperes summary small { display: block; font-weight: 600; color: var(--mut); font-size: 12px; }
  .reperes summary .plus { margin-left: auto; color: var(--mut); transition: transform .25s var(--ease); }
  .reperes[open] summary .plus { transform: rotate(45deg); }
  .reperes ol { list-style: none; margin: 0; padding: 0 16px 16px 36px; position: relative; }
  .reperes ol::before { content: ""; position: absolute; left: 35px; top: 8px; bottom: 26px; width: 2px; background: linear-gradient(var(--ice), rgba(143,216,255,.1)); }
  .reperes li { position: relative; padding: 0 0 12px 22px; }
  .reperes li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ice); }
  .reperes li b { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ice); }
  .reperes li span { font-size: 14px; }

  /* Fiche */
  .retour { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--verre2); border: 1px solid var(--bord); font-size: 14px; font-weight: 700; margin-top: 4px; }
  .retour svg.i { width: 17px; height: 17px; }
  .bandeau { position: relative; margin-top: 12px; padding: 18px 18px 16px; border-radius: 26px; overflow: hidden;
    background: linear-gradient(150deg, color-mix(in srgb, var(--c) 30%, transparent), rgba(255,255,255,.03) 65%) padding-box, linear-gradient(150deg, color-mix(in srgb, var(--c) 75%, transparent), rgba(255,255,255,.06) 55%) border-box; border: 1px solid transparent; }
  .bandeau .filigrane { position: absolute; right: -24px; top: -16px; width: 150px; height: 150px; color: var(--c); opacity: .12; stroke-width: 1.3; }
  .niv { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .niv i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .niv.rouge { background: rgba(255,77,97,.2); color: #ff8b99; } .niv.rouge i { animation: clign 1.2s infinite; }
  .niv.orange { background: rgba(255,181,71,.18); color: var(--orange); } .niv.vert { background: rgba(62,227,154,.16); color: var(--vert); }
  @keyframes clign { 50% { opacity: .25; } }
  .bandeau h1 { position: relative; margin: 12px 0 10px; font-size: 27px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; }
  .avant { display: flex; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 18px; background: rgba(255,181,71,.10); border: 1px solid rgba(255,181,71,.32); font-size: 15px; font-weight: 600; }
  .avant svg.i { color: var(--orange); margin-top: 1px; }
  .avant.rouge { background: rgba(255,77,97,.12); border-color: rgba(255,77,97,.42); } .avant.rouge svg.i { color: var(--rouge); }
  .anneau { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 13px; font-weight: 800; letter-spacing: 0; text-transform: none; }
  .anneau svg { width: 30px; height: 30px; transform: rotate(-90deg); }
  .anneau circle { fill: none; stroke-width: 4; } .anneau .f { stroke: rgba(255,255,255,.1); } .anneau .p { stroke: var(--vert); stroke-linecap: round; transition: stroke-dashoffset .4s var(--ease); }
  .etapes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .etapes button { display: flex; gap: 13px; width: 100%; padding: 14px; border-radius: 18px; background: var(--verre); border: 1px solid var(--bord); font-size: 16px; font-weight: 600; line-height: 1.42; transition: background .25s, border-color .25s, opacity .25s; }
  .etapes .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); font-weight: 800; font-size: 14px; transition: background .25s, transform .3s var(--ease); }
  .etapes .n svg { display: none; width: 16px; height: 16px; stroke-width: 3; }
  .etapes .fait button { opacity: .55; background: rgba(62,227,154,.06); border-color: rgba(62,227,154,.22); }
  .etapes .fait .n { background: var(--vert); color: #032515; transform: scale(1.08); }
  .etapes .fait .n span { display: none; } .etapes .fait .n svg { display: block; }
  .bravo { display: none; margin-top: 12px; padding: 18px; border-radius: 22px; text-align: center; background: linear-gradient(160deg, rgba(62,227,154,.2), rgba(62,227,154,.05)); border: 1px solid rgba(62,227,154,.45); animation: entre .4s var(--ease) both; }
  .bravo.ok { display: block; }
  .bravo b { display: block; font-size: 18px; font-weight: 800; } .bravo p { margin: 4px 0 14px; color: var(--mut); font-size: 14px; }
  .bravo .duo { display: flex; gap: 8px; }
  .bravo .duo > * { flex: 1; height: 48px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .bravo .oui { background: var(--vert); color: #032515; } .bravo .non { background: var(--verre2); border: 1px solid var(--bord); }

  .media { display: flex; flex-direction: column; gap: 10px; }
  .video { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 20px; width: 100%; background: var(--verre); border: 1px solid var(--bord); }
  .video .vign { flex: none; position: relative; width: 104px; height: 64px; border-radius: 14px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 20%, rgba(143,216,255,.45), transparent 60%), linear-gradient(135deg, #12335f, #0a1d3a); }
  .video .vign span { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .video .vign span svg { width: 16px; height: 16px; fill: #0a1d3a; margin-left: 2px; }
  .video b { display: block; font-size: 15px; font-weight: 800; line-height: 1.25; }
  .video small { color: var(--mut); font-size: 12px; font-weight: 600; }
  figure.schema { margin: 0; padding: 16px; border-radius: 22px; background: linear-gradient(180deg, rgba(143,216,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--bord); }
  figure.schema figcaption { color: var(--mut); font-size: 13.5px; margin-top: 12px; font-weight: 500; }
  figure.schema figcaption b { display: block; font-size: 15px; font-weight: 800; color: var(--txt); margin-bottom: 2px; }
  figure.schema svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--txt); text-anchor: middle; font-family: "Manrope", sans-serif; }
  svg .tb { font-size: 12px; font-weight: 800; } svg .ts { font-size: 10px; fill: var(--mut); font-weight: 600; } svg .tt { font-size: 10px; font-weight: 800; fill: var(--bg); }
  svg .alerte { fill: var(--rouge); font-weight: 800; } svg .froidt { fill: #5cc8ff; } svg .chaudt { fill: #ff9a6b; }
  svg .xlrt { fill: #c38bff; } svg .spkt { fill: var(--orange); }
  svg .bloc { fill: #0d2747; stroke: rgba(255,255,255,.16); stroke-width: 1.5; }
  svg .piste { fill: rgba(143,216,255,.10); stroke: var(--ice); stroke-width: 1.5; stroke-dasharray: 4 4; }
  svg .tuyau { stroke: var(--mut); stroke-width: 4; fill: none; stroke-linecap: round; } svg .tuyau.froid { stroke: #5cc8ff; } svg .tuyau.chaud { stroke: #ff9a6b; }
  svg .serp { stroke: #5cc8ff; stroke-width: 2.5; fill: none; opacity: .85; stroke-dasharray: 5 4; animation: glisse 5s linear infinite; }
  svg .vanne path { fill: var(--orange); } svg .vanne line { stroke: var(--orange); stroke-width: 2.5; }
  svg .dj { fill: #12305a; stroke: rgba(255,255,255,.14); } svg .dj.gen { stroke: var(--ice); stroke-width: 1.5; }
  svg .levier.on { fill: var(--vert); } svg .levier.off { fill: var(--rouge); }
  svg .testbtn { fill: var(--orange); }
  svg .hp { fill: var(--bg); stroke: rgba(255,255,255,.2); stroke-width: 2; }
  svg .cable { stroke: var(--mut); stroke-width: 3; fill: none; stroke-linecap: round; } svg .cable.xlr { stroke: #c38bff; } svg .cable.spk { stroke: var(--orange); }
  svg .pin { fill: var(--ice); } svg .fleche { stroke: var(--ice); stroke-width: 2.5; fill: none; stroke-linecap: round; }

  .appel { margin-top: 26px; padding: 18px; border-radius: 24px; background: linear-gradient(135deg, #1d6fd8, #0a3576); border: 1px solid rgba(143,216,255,.4); box-shadow: 0 16px 40px -16px rgba(29,111,216,.6); }
  .appel p { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.88); }
  .appel p b { color: #fff; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .gros { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 16px; font-weight: 800; font-size: 16px; background: #fff; color: #0a3576; width: 100%; }
  .gros svg.i { width: 20px; height: 20px; }
  .gros span { flex: 1; } .gros small { font-weight: 700; font-size: 13px; opacity: .65; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gros.sec { background: var(--rouge); color: #fff; } .gros.cl { background: var(--verre2); color: var(--txt); border: 1px solid var(--bord); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; background: var(--verre); border: 1px solid var(--bord); font-size: 14px; font-weight: 700; color: var(--mut); }
  .actions svg.i { width: 17px; height: 17px; }

  /* Barre d'appel flottante (fiches) */
  .flot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px 16px calc(10px + var(--safe-b)); background: linear-gradient(transparent, rgba(4,18,37,.9) 35%); transform: translateY(110%); transition: transform .35s var(--ease); pointer-events: none; }
  .flot.ouvert { transform: none; }
  .flot a { pointer-events: auto; max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 8px 0 18px; border-radius: 999px; font-weight: 800; color: #fff;
    background: rgba(29,111,216,.88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(143,216,255,.45); box-shadow: 0 12px 30px -8px rgba(0,0,0,.6); }
  .flot a .t { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .flot a small { display: block; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.7); overflow: hidden; text-overflow: ellipsis; }
  .flot .rond { width: 44px; height: 44px; }

  /* Feuilles, lecteur, toast */
  .voile { position: fixed; inset: 0; background: rgba(1,8,18,.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .voile.ouvert { opacity: 1; pointer-events: auto; }
  .feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-width: 560px; margin: 0 auto; padding: 10px 16px calc(20px + var(--safe-b)); border-radius: 28px 28px 0 0;
    background: rgba(9,28,54,.92); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); border-top: 1px solid var(--bord2); transform: translateY(105%); transition: transform .35s var(--ease); }
  .feuille.ouvert { transform: none; }
  .feuille .poignee { width: 40px; height: 5px; border-radius: 5px; background: var(--bord2); margin: 0 auto 14px; }
  .feuille h3 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .feuille p { margin: 0 0 16px; color: var(--mut); font-size: 14px; font-weight: 500; }
  .choix-site { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--verre); border: 1px solid var(--bord); width: 100%; }
  .choix-site.actif { border-color: var(--ice); background: rgba(143,216,255,.1); }
  .choix-site .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(143,216,255,.14); color: var(--ice); }
  .choix-site b { display: block; font-weight: 800; } .choix-site small { color: var(--mut); font-size: 12px; font-weight: 600; }
  .choix-site .ok { margin-left: auto; color: var(--ice); }
  .lecteur { position: fixed; inset: 0; z-index: 70; background: #000; display: none; flex-direction: column; }
  .lecteur.ouvert { display: flex; animation: entre .3s var(--ease); }
  .lecteur .barre { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + var(--safe-t)) 16px 10px; gap: 12px; }
  .lecteur .barre b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lecteur .barre button { flex: none; }
  .lecteur .cadre { flex: 1; display: grid; place-items: center; }
  .lecteur iframe { width: 100%; aspect-ratio: 16/9; border: 0; }
  .lecteur .horsligne { color: var(--mut); padding: 24px; text-align: center; }
  .toast { position: fixed; left: 50%; top: calc(12px + var(--safe-t)); z-index: 80; transform: translate(-50%, -150%); display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; white-space: nowrap; max-width: calc(100vw - 32px);
    background: rgba(255,255,255,.96); color: #0a2148; box-shadow: 0 14px 40px rgba(0,0,0,.4); transition: transform .5s cubic-bezier(.2,1.4,.4,1); }
  .toast.ouvert { transform: translate(-50%, 0); }
  .toast .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #1d6fd8; color: #fff; }
  .toast b { display: block; font-size: 14px; font-weight: 800; } .toast small { display: block; color: #50668c; font-size: 12px; font-weight: 600; }

  footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 12px; font-weight: 600; line-height: 1.7; }
  footer button { color: var(--ice); font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--verre); border: 1px solid var(--bord); }
  footer button svg.i { width: 15px; height: 15px; }
  .cache { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<!-- Icônes -->

<script src="/synerglace/fiches.js"></script>
<script src="/synerglace/schemas.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const vue = $("#vue");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const telAff = t => t.replace("+33", "0").replace(/(\d)(?=(\d{2})+$)/g, "$1 ");
  const ico = (id, st) => `<svg class="i"${st ? ` style="${st}"` : ""}><use href="#i-${id}"/></svg>`;
  const NIV = { rouge: "Urgent · sécurité", orange: "À traiter vite", vert: "Routine" };

  // ---------- Patinoire (badge / QR) ----------
  const params = new URLSearchParams(location.search);
  let siteId = params.get("site");
  try { if (!SITES[siteId]) siteId = localStorage.getItem("sg-site"); } catch (e) {}
  if (!SITES[siteId]) siteId = "place-armes";
  const via = params.get("via");
  function setSite(id, garder) {
    siteId = id;
    try { localStorage.setItem("sg-site", id); } catch (e) {}
    $("#siteNomCourt").textContent = SITES[id].nom;
    const u = new URL(location.href);
    u.searchParams.set("site", id); u.searchParams.delete("via");
    history.replaceState(history.state, "", u.pathname + u.search + location.hash);
    if (!garder) rendre();
  }
  setSite(siteId, true);

  // ---------- Recherche ----------
  const IDX = FICHES.map(f => ({
    f,
    titre: norm(f.titre),
    mots: norm(f.mots + " " + CATS[f.cat].nom),
    corps: norm([f.avant, ...f.etapes].join(" ")),
  }));
  const VIDES = new Set("la le les de des du un une en et est au aux ne pas plus il elle on ca ce cet cette qui que mon ma ya trop tres sur".split(" "));
  function chercher(q) {
    const toks = norm(q).split(" ").filter(t => t.length > 1 && !VIDES.has(t));
    if (!toks.length) return [];
    const res = [];
    for (const x of IDX) {
      let score = 0, touches = 0;
      for (const t of toks) {
        const re = new RegExp("(^| )" + t);
        let s = 0;
        if (re.test(x.titre)) s = 6; else if (re.test(x.mots)) s = 4; else if (re.test(x.corps)) s = 1;
        if (s) touches++;
        score += s;
      }
      if (x.titre.includes(norm(q))) score += 8;
      if (touches) res.push({ f: x.f, score: score * (touches / toks.length) });
    }
    res.sort((a, b) => b.score - a.score);
    const max = res.length ? res[0].score : 0;
    return res.filter(r => r.score >= 2 && r.score >= max * .4).slice(0, 8).map(r => r.f);
  }

  // ---------- Morceaux ----------
  const ligneFiche = f => `<button class="ligne press ${f.niveau === "rouge" ? "urgent" : ""}" data-fiche="${f.id}" style="--c:${CATS[f.cat].coul}">
      <span class="ic">${ico(f.cat)}<i class="d-${f.niveau}"></i></span>
      <span class="t"><b>${esc(f.titre)}</b><small>${CATS[f.cat].nom} · ${f.duree}</small></span>${ico("droite", "").replace('class="i"', 'class="i chev"')}</button>`;

  function boutonAppel(cle, cls) {
    const c = CONTACTS[cle];
    return `<a class="gros press ${cls || ""}" href="tel:${c.tel}">${ico("tel")}<span>${esc(c.label)}</span><small>${telAff(c.tel)}</small></a>`;
  }

  // Piste vue de dessus, avec traces de patins qui glissent
  const pisteSvg = `<svg class="piste-svg" viewBox="0 0 320 120" aria-hidden="true">
      <defs>
        <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe9ff" stop-opacity=".35"/><stop offset=".5" stop-color="#8fd8ff" stop-opacity=".12"/><stop offset="1" stop-color="#bfe9ff" stop-opacity=".28"/></linearGradient>
        <linearGradient id="reflet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="cp"><rect x="6" y="6" width="308" height="108" rx="44"/></clipPath>
      </defs>
      <rect x="6" y="6" width="308" height="108" rx="44" fill="url(#gl)" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
      <g clip-path="url(#cp)">
        <rect x="-120" y="0" width="80" height="120" fill="url(#reflet)" transform="skewX(-20)"><animate attributeName="x" from="-160" to="420" dur="5s" repeatCount="indefinite"/></rect>
        <line x1="160" y1="6" x2="160" y2="114" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
        <circle cx="160" cy="60" r="20" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
        <path class="trace" d="M40 80 C90 20, 150 110, 210 50 S290 40, 300 70" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
        <path class="trace b" d="M30 40 C80 100, 140 10, 200 75 S270 95, 300 35" fill="none" stroke="rgba(143,216,255,.7)" stroke-width="1.4"/>
      </g>
    </svg>`;

  // ---------- Accueil ----------
  function accueil() {
    const s = SITES[siteId], A = CONTACTS.astreinte;
    vue.innerHTML = `
      <section class="hero">
        <div class="eyebrow">Patinoire de Belfort</div>
        <h1>${esc(s.nom)}</h1>
        <div class="adr">${esc(s.adr)}</div>
        ${pisteSvg}
        <div class="puces">${s.piste.split(" · ").map(p => `<span class="puce">${esc(p)}</span>`).join("")}<span class="puce ok"><i></i>Fonctionne sans réseau</span></div>
      </section>

      <div>
        <h2 class="sec">Urgences <span>appel direct</span></h2>
        <a class="sos press" href="tel:${A.tel}">
          <span class="t"><small>${esc(A.qui)}</small><b>${esc(A.label)}</b><span class="num">${telAff(A.tel)}</span></span>
          <span class="rond">${ico("tel")}</span>
        </a>
        <div class="urg3">
          <a class="press" href="tel:${CONTACTS.elec.tel}"><span class="ic" style="background:rgba(255,200,61,.16);color:#ffc83d">${ico("elec")}</span><span><b>Électricien</b><small>Dépannage</small></span></a>
          <a class="press" href="tel:${CONTACTS.mairie.tel}"><span class="ic" style="background:rgba(143,216,255,.14);color:var(--ice)">${ico("mairie")}</span><span><b>Mairie</b><small>Services tech.</small></span></a>
          <button class="press rge" id="btnSecours"><span class="ic" style="background:var(--rouge);color:#fff">${ico("croix")}</span><span><b>Secours</b><small>112 · 18 · 15</small></span></button>
        </div>
      </div>

      <div>
        <h2 class="sec">Quel est le problème ?</h2>
        <div class="cherche" id="cherche">
          <svg class="i loupe"><use href="#i-loupe"/></svg>
          <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="glace molle, plus de son, TPE…">
          <button class="eff" id="eff" aria-label="Effacer">${ico("x", "width:18px;height:18px")}</button>
        </div>
        <div class="chips" id="chips">${SUGGESTIONS.map(s => `<button class="press" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
        <div id="resultats" class="liste" style="margin-top:12px"></div>
      </div>

      <div id="blocThemes">
        <h2 class="sec">Fiches réflexes <span>${FICHES.length} fiches</span></h2>
        <div class="tuiles">${Object.entries(CATS).map(([k, c]) => `
          <button class="tuile press" style="--c:${c.coul}" data-cat="${k}">
            <span class="badge">${ico(k, "width:24px;height:24px")}</span>
            <svg class="i filigrane"><use href="#i-${k}"/></svg>
            <span class="nb">${FICHES.filter(f => f.cat === k).length}</span>
            <b>${c.nom}</b><small>${c.sous}</small></button>`).join("")}
        </div>

        <h2 class="sec">Urgent · sécurité</h2>
        <div class="liste">${FICHES.filter(f => f.niveau === "rouge").map(ligneFiche).join("")}</div>

        <h2 class="sec">Ce site</h2>
        <details class="reperes"><summary><span class="ic">${ico("carte")}</span><span>Repères de la patinoire<small>${s.reperes.length} points clés · ${esc(s.nom)}</small></span><span class="plus">${ico("x", "transform:rotate(45deg)")}</span></summary>
          <ol>${s.reperes.map(([a, b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join("")}</ol>
        </details>
      </div>
      ${pied()}`;

    const q = $("#q"), res = $("#resultats"), cherche = $("#cherche"), themes = $("#blocThemes");
    function maj() {
      const v = q.value.trim();
      cherche.classList.toggle("rempli", !!v);
      themes.classList.toggle("cache", !!v);
      if (!v) { res.innerHTML = ""; return; }
      const r = chercher(v);
      res.innerHTML = r.length ? r.map(ligneFiche).join("")
        : `<div class="vide">Rien trouvé pour « ${esc(v)} ». Essayez un autre mot, ou appelez l'astreinte.</div>${boutonAppel("astreinte")}`;
    }
    q.addEventListener("input", maj);
    q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
    $("#eff").onclick = () => { q.value = ""; maj(); q.focus(); };
    $("#chips").onclick = e => { const b = e.target.closest("[data-sug]"); if (b) { q.value = b.dataset.sug; maj(); } };
    $("#btnSecours").onclick = secours;
    if (memoQ) { q.value = memoQ; maj(); }
    flot(null);
  }

  // ---------- Thème ----------
  function categorie(k) {
    const c = CATS[k];
    vue.innerHTML = `
      ${retour()}
      <section class="bandeau" style="--c:${c.coul}">
        <svg class="i filigrane"><use href="#i-${k}"/></svg>
        <div class="eyebrow" style="color:${c.coul};position:relative">Fiches réflexes</div>
        <h1>${c.nom}</h1>
        <div class="puces" style="position:relative"><span class="puce">${c.sous}</span></div>
      </section>
      <div class="liste" style="margin-top:14px">${FICHES.filter(f => f.cat === k).map(ligneFiche).join("")}</div>
      ${pied()}`;
    flot(null);
  }

  // ---------- Fiche ----------
  function fiche(id) {
    const f = FICHES.find(x => x.id === id);
    if (!f) return go("");
    const c = CATS[f.cat], sch = f.schema && SCHEMAS[f.schema], R = 12, CIRC = 2 * Math.PI * R;
    vue.innerHTML = `
      ${retour()}
      <section class="bandeau" style="--c:${c.coul}">
        <svg class="i filigrane"><use href="#i-${f.cat}"/></svg>
        <span class="niv ${f.niveau}"><i></i>${NIV[f.niveau]}</span>
        <h1>${esc(f.titre)}</h1>
        <div class="puces" style="position:relative">
          <span class="puce" style="color:${c.coul}">${ico(f.cat, "width:14px;height:14px")}${c.nom}</span>
          <span class="puce">${f.duree}</span>
          <span class="puce">${ico("pin", "width:13px;height:13px")}${esc(SITES[siteId].nom)}</span>
        </div>
      </section>
      <div class="avant ${f.niveau === "rouge" ? "rouge" : ""}">${ico("alerte")}<span>${esc(f.avant)}</span></div>

      <div style="--c:${c.coul}">
        <h2 class="sec">Étapes
          <span class="anneau"><span id="compte">0 / ${f.etapes.length}</span>
            <svg viewBox="0 0 30 30"><circle class="f" cx="15" cy="15" r="${R}"/><circle class="p" id="anneau" cx="15" cy="15" r="${R}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg></span>
        </h2>
        <ol class="etapes" id="etapes">${f.etapes.map((e, i) => `<li><button><span class="n"><span>${i + 1}</span><svg class="i"><use href="#i-ok"/></svg></span><span>${esc(e)}</span></button></li>`).join("")}</ol>
        <div class="bravo" id="bravo"><b>Toutes les étapes sont faites</b><p>Le problème est réglé ?</p>
          <div class="duo"><button class="oui press" id="oui">Oui, c'est réglé</button><a class="non press" href="tel:${CONTACTS[f.appel[0]].tel}">Non, j'appelle</a></div></div>
      </div>

      ${f.video || sch ? `<div><h2 class="sec">${f.video && sch ? "Schéma & vidéo" : sch ? "Schéma" : "Vidéo"}</h2><div class="media">
        ${sch ? `<figure class="schema">${sch.svg}<figcaption><b>${esc(sch.titre)}</b>${esc(sch.legende)}</figcaption></figure>` : ""}
        ${f.video ? `<button class="video press" data-video="${f.video.id}" data-titre="${esc(f.video.titre)}">
          <span class="vign"><span><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></span></span>
          <span><b>${esc(f.video.titre)}</b><small>Tutoriel vidéo · nécessite du réseau</small></span></button>` : ""}
      </div></div>` : ""}

      <div class="appel" id="blocAppel">
        <p>Toujours en panne ? Appelez si <b>${esc(f.appelSi)}</b>.</p>
        <div class="btns">${f.appel.map(k => boutonAppel(k)).join("")}</div>
      </div>
      <div class="actions">
        <button class="press" id="raz">${ico("raz")}Recommencer</button>
        <button class="press" id="partager">${ico("partage")}Envoyer la fiche</button>
      </div>
      ${pied()}`;

    const lis = [...document.querySelectorAll("#etapes li")];
    const prog = () => {
      const n = lis.filter(l => l.classList.contains("fait")).length;
      $("#anneau").style.strokeDashoffset = CIRC * (1 - n / lis.length);
      $("#compte").textContent = `${n} / ${lis.length}`;
      const fini = n === lis.length;
      if (fini && !$("#bravo").classList.contains("ok")) {
        $("#bravo").classList.add("ok");
        if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
      } else if (!fini) $("#bravo").classList.remove("ok");
    };
    $("#etapes").onclick = e => { const li = e.target.closest("li"); if (li) { li.classList.toggle("fait"); prog(); } };
    $("#raz").onclick = () => { lis.forEach(l => l.classList.remove("fait")); prog(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    $("#oui").onclick = () => { toast("Bien joué !", "Problème réglé · " + SITES[siteId].nom, "ok"); go(""); };
    $("#partager").onclick = async () => {
      const url = location.origin + location.pathname + "?site=" + siteId + "#/fiche/" + f.id;
      const txt = `${f.titre} · ${SITES[siteId].nom}`;
      try {
        if (navigator.share) await navigator.share({ title: txt, url });
        else { await navigator.clipboard.writeText(url); toast("Lien copié", txt, "partage"); }
      } catch (e) {}
    };
    flot(f.appel[0]);
  }

  const retour = () => `<button class="retour press" data-retour>${ico("gauche")}Retour</button>`;
  const pied = () => `<footer>Démonstration iDkom pour Synerglace · contenu indicatif<br>
      <button data-install class="press">${ico("install")}Ajouter à l'écran d'accueil</button></footer>`;

  // Barre d'appel flottante : visible sur une fiche tant que le bloc d'appel n'est pas à l'écran
  let flotActif = false;
  function flot(cle) {
    const el = $("#flot");
    flotActif = !!cle;
    if (!cle) { el.classList.remove("ouvert"); return; }
    const c = CONTACTS[cle];
    el.innerHTML = `<a href="tel:${c.tel}" class="press"><span class="t">${esc(c.label)}<small>Un doute ? Appel direct · ${telAff(c.tel)}</small></span><span class="rond" style="color:#0d4597">${ico("tel", "width:20px;height:20px")}</span></a>`;
    majFlot();
  }
  function majFlot() {
    const b = $("#blocAppel");
    $("#flot").classList.toggle("ouvert", flotActif && !!b && window.scrollY > 120 && b.getBoundingClientRect().top > innerHeight);
  }

  // ---------- Feuilles ----------
  function ouvrirFeuille(html) {
    $("#feuilleCorps").innerHTML = html;
    $("#voile").classList.add("ouvert"); $("#feuille").classList.add("ouvert");
  }
  function fermerFeuille() { $("#voile").classList.remove("ouvert"); $("#feuille").classList.remove("ouvert"); }
  $("#voile").onclick = fermerFeuille;

  function secours() {
    ouvrirFeuille(`<h3>Secours</h3><p>Blessé, malaise, incendie : appelez d'abord les secours, puis l'astreinte.</p>
      <div class="btns">
        <a class="gros sec press" href="tel:112">${ico("croix")}<span>112</span><small>Urgences</small></a>
        <a class="gros cl press" href="tel:18">${ico("tel")}<span>18</span><small>Pompiers</small></a>
        <a class="gros cl press" href="tel:15">${ico("tel")}<span>15</span><small>SAMU</small></a>
        ${boutonAppel("astreinte", "cl")}
      </div>`);
  }
  function choixSite() {
    ouvrirFeuille(`<h3>Quelle patinoire ?</h3><p>Chaque badge ouvre directement sa patinoire.</p>
      <div class="btns">${Object.entries(SITES).map(([k, s]) => `
        <button class="choix-site press ${k === siteId ? "actif" : ""}" data-site="${k}"><span class="ic">${ico("patin")}</span>
        <span><b>${esc(s.nom)}</b><small>${esc(s.piste)}</small></span>${k === siteId ? `<span class="ok">${ico("ok")}</span>` : ""}</button>`).join("")}</div>`);
  }
  $("#siteBtn").onclick = choixSite;
  $("#feuilleCorps").onclick = e => {
    const b = e.target.closest("[data-site]");
    if (b) { fermerFeuille(); setSite(b.dataset.site); window.scrollTo(0, 0); toast("Patinoire " + SITES[b.dataset.site].nom, "Fiches et repères du site", "patin"); }
  };

  // ---------- Vidéo ----------
  function video(id, titre) {
    $("#lecteurTitre").textContent = titre;
    $("#lecteurCadre").innerHTML = navigator.onLine
      ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`
      : `<div class="horsligne">Pas de réseau : la vidéo sera disponible dès que la connexion revient.<br>Les étapes de la fiche restent utilisables.</div>`;
    $("#lecteur").classList.add("ouvert");
  }
  $("#lecteurFermer").onclick = () => { $("#lecteur").classList.remove("ouvert"); $("#lecteurCadre").innerHTML = ""; };

  // ---------- Toast ----------
  let tt;
  function toast(a, b, icone) {
    const t = $("#toast");
    t.innerHTML = `<span class="ic">${ico(icone || "ok", "width:18px;height:18px")}</span><span><b>${esc(a)}</b>${b ? `<small>${esc(b)}</small>` : ""}</span>`;
    t.classList.add("ouvert"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("ouvert"), 3000);
  }

  // ---------- Navigation ----------
  let memoQ = "";
  function go(h) { location.hash = h ? "#/" + h : ""; }
  vue.addEventListener("click", e => {
    const fi = e.target.closest("[data-fiche]"), ca = e.target.closest("[data-cat]"), vi = e.target.closest("[data-video]");
    if (fi) { const q = $("#q"); memoQ = q ? q.value : memoQ; go("fiche/" + fi.dataset.fiche); }
    else if (ca) { memoQ = ""; go("cat/" + ca.dataset.cat); }
    else if (vi) video(vi.dataset.video, vi.dataset.titre);
    else if (e.target.closest("[data-retour]")) { history.length > 1 && location.hash ? history.back() : go(""); }
    else if (e.target.closest("[data-install]")) installer();
  });
  function rendre() {
    const [, type, id] = (location.hash.match(/^#\/(\w+)\/([\w-]+)/) || []);
    if (type === "fiche") fiche(id);
    else if (type === "cat" && CATS[id]) categorie(id);
    else accueil();
  }
  window.addEventListener("hashchange", () => { rendre(); window.scrollTo(0, 0); });
  rendre();

  window.addEventListener("scroll", () => { $("#entete").classList.toggle("colle", window.scrollY > 8); majFlot(); }, { passive: true });

  if (via === "nfc" || via === "qr")
    setTimeout(() => toast(via === "nfc" ? "Badge NFC reconnu" : "QR code scanné", "Patinoire " + SITES[siteId].nom, via === "nfc" ? "badge" : "ok"), 450);

  // ---------- Neige ----------
  (function neige() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("#neige"), cx = cv.getContext("2d");
    let W, H, dpr, flocons = [];
    function taille() {
      dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(60, W * H / 9000));
      flocons = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.8, v: .15 + Math.random() * .45, d: Math.random() * 6.28, a: .15 + Math.random() * .35 }));
    }
    taille(); addEventListener("resize", taille);
    (function boucle() {
      if (!document.hidden) {
        cx.clearRect(0, 0, W, H);
        for (const f of flocons) {
          f.y += f.v; f.d += .01; f.x += Math.sin(f.d) * .25;
          if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
          cx.globalAlpha = f.a; cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.28); cx.fillStyle = "#dff3ff"; cx.fill();
        }
      }
      requestAnimationFrame(boucle);
    })();
  })();

  // ---------- Écran d'accueil + hors ligne ----------
  let invite = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); invite = e; });
  function installer() {
    if (invite) { invite.prompt(); invite = null; return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    ouvrirFeuille(`<h3>Ajouter à l'écran d'accueil</h3>
      <p>${ios ? "Dans Safari : bouton Partager, puis « Sur l'écran d'accueil »." : "Menu du navigateur ⋮, puis « Ajouter à l'écran d'accueil »."}
      L'appli s'ouvre alors comme une application et ses fiches restent consultables sans réseau.</p>
      <div class="btns"><button class="gros cl" style="justify-content:center" onclick="document.getElementById('voile').click()">Compris</button></div>`);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/synerglace-sw.js", { scope: "/synerglace" }).catch(() => {});
})();
</script>
</body>
</html>
