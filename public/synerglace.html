<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#041225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synerglace">
<title>Synerglace · Assistance patinoire</title>
<link rel="manifest" href="/synerglace/manifest.webmanifest">
<link rel="apple-touch-icon" href="/synerglace/apple-touch-icon.png">
<link rel="icon" href="/synerglace/icon-192.png">
<style>
  :root {
    --bg: #041225; --bg2: #071a33; --card: #0c2344; --card2: #102c55; --line: #1b3a66;
    --txt: #eef5ff; --mut: #9fb4d1; --ice: #8fd3ff; --rouge: #ff4d5e; --orange: #ffab3d; --vert: #3fd68f;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: calc(24px + var(--safe-b)); overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* En-tête */
  header { position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 80%, rgba(4,18,37,.94)); padding-top: var(--safe-t); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 58px; }
  .top img { height: 38px; width: auto; display: block; }
  .site-btn { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--ice); white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
  .site-btn svg { flex: none; }
  .retour { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--ice); padding: 8px 0; }

  .hero { padding: 6px 0 14px; }
  .hero .etq { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); }
  .hero h1 { margin: 2px 0 2px; font-size: 26px; line-height: 1.15; }
  .hero p { margin: 0; color: var(--mut); font-size: 14px; }
  .etat { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--mut); }
  .etat i { width: 8px; height: 8px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 0 3px rgba(63,214,143,.18); }

  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin: 22px 0 10px; font-weight: 600; }

  /* Urgences */
  .urg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .urg a, .urg button { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 76px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; }
  .urg .ico { font-size: 20px; line-height: 1; margin-bottom: 4px; }
  .urg b { font-size: 15px; line-height: 1.2; }
  .urg small { font-size: 12px; color: var(--mut); }
  .urg .astr { background: linear-gradient(135deg, #0f3f78, #0b2c57); border-color: #2a5fa0; }
  .urg .sec { background: linear-gradient(135deg, #7a1222, #521019); border-color: #a02338; }
  .urg a:active, .urg button:active, .tuile:active, .ligne:active { transform: scale(.98); }

  /* Recherche */
  .cherche { position: relative; margin-top: 4px; }
  .cherche input { width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--txt); font: inherit; font-size: 17px; padding: 0 44px 0 46px; outline: none; -webkit-appearance: none; }
  .cherche input:focus { border-color: var(--ice); box-shadow: 0 0 0 3px rgba(143,211,255,.18); }
  .cherche input::placeholder { color: #6f86a8; }
  .cherche .loupe { position: absolute; left: 15px; top: 15px; color: var(--mut); pointer-events: none; }
  .cherche .eff { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border-radius: 10px; color: var(--mut); display: none; font-size: 22px; }
  .cherche.rempli .eff { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 13px; padding: 7px 12px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); color: var(--mut); }
  .vide { color: var(--mut); font-size: 15px; padding: 14px 4px; }

  /* Thèmes */
  .tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tuile { position: relative; min-height: 118px; border-radius: 18px; padding: 14px; text-align: left; background: var(--card); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .tuile::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 10%, var(--c) 0, transparent 60%); opacity: .22; }
  .tuile .ico { position: absolute; top: 12px; left: 14px; font-size: 26px; }
  .tuile .nb { position: absolute; top: 14px; right: 14px; font-size: 12px; color: var(--mut); }
  .tuile b { position: relative; font-size: 16px; line-height: 1.2; }
  .tuile small { position: relative; color: var(--mut); font-size: 12px; line-height: 1.3; margin-top: 3px; }

  /* Listes de fiches */
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .ligne { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-align: left; width: 100%; }
  .ligne .pastille { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .ligne .t { flex: 1; min-width: 0; }
  .ligne b { display: block; font-size: 15px; line-height: 1.25; }
  .ligne small { display: block; color: var(--mut); font-size: 12px; margin-top: 2px; }
  .ligne .chev { color: var(--mut); flex: none; }
  .p-rouge { background: var(--rouge); } .p-orange { background: var(--orange); } .p-vert { background: var(--vert); }

  /* Repères */
  details.reperes { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
  details.reperes summary { list-style: none; padding: 14px 0; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; }
  details.reperes summary::-webkit-details-marker { display: none; }
  details.reperes[open] summary .pl { transform: rotate(45deg); }
  .pl { transition: transform .2s; color: var(--mut); }
  .reperes dl { margin: 0 0 14px; }
  .reperes dt { font-size: 12px; color: var(--ice); text-transform: uppercase; letter-spacing: .06em; margin-top: 10px; }
  .reperes dd { margin: 2px 0 0; font-size: 14px; }

  /* Fiche */
  .badge-niv { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
  .n-rouge { background: rgba(255,77,94,.16); color: #ff8592; }
  .n-orange { background: rgba(255,171,61,.15); color: var(--orange); }
  .n-vert { background: rgba(63,214,143,.14); color: var(--vert); }
  .fiche h1 { font-size: 24px; line-height: 1.2; margin: 10px 0 4px; }
  .fiche .meta { color: var(--mut); font-size: 13px; }
  .avant { display: flex; gap: 10px; margin-top: 16px; padding: 13px 14px; border-radius: 14px; background: rgba(255,171,61,.10); border: 1px solid rgba(255,171,61,.35); font-size: 15px; }
  .avant.rouge { background: rgba(255,77,94,.12); border-color: rgba(255,77,94,.45); }
  .etapes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: e; }
  .etapes li { counter-increment: e; }
  .etapes button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 16px; line-height: 1.4; }
  .etapes button::before { content: counter(e); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--ice); font-weight: 700; font-size: 14px; }
  .etapes .fait button { opacity: .5; }
  .etapes .fait button::before { content: "✓"; background: var(--vert); color: #04220f; }
  .progres { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 10px; }
  .progres i { display: block; height: 100%; width: 0; background: var(--vert); transition: width .25s; }

  .media { display: flex; flex-direction: column; gap: 10px; }
  .video { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-align: left; width: 100%; }
  .video .play { flex: none; width: 64px; height: 46px; border-radius: 10px; background: #e5182b; display: grid; place-items: center; }
  .video b { display: block; font-size: 15px; }
  .video small { color: var(--mut); font-size: 12px; }
  figure.schema { margin: 0; padding: 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
  figure.schema figcaption b { display: block; font-size: 15px; margin-bottom: 2px; }
  figure.schema figcaption { color: var(--mut); font-size: 13px; margin-top: 10px; }
  figure.schema svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--txt); text-anchor: middle; font-family: inherit; }
  svg .tb { font-size: 12px; font-weight: 700; } svg .ts { font-size: 10px; fill: var(--mut); } svg .tt { font-size: 10px; font-weight: 700; fill: var(--bg); }
  svg .alerte { fill: var(--rouge); font-weight: 700; } svg .froidt { fill: #5cc8ff; } svg .chaudt { fill: #ff9a6b; }
  svg .xlrt { fill: #c38bff; } svg .spkt { fill: var(--orange); }
  svg .bloc { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  svg .piste { fill: rgba(143,211,255,.10); stroke: var(--ice); stroke-width: 1.5; stroke-dasharray: 4 4; }
  svg .tuyau { stroke: var(--mut); stroke-width: 4; fill: none; } svg .tuyau.froid { stroke: #5cc8ff; } svg .tuyau.chaud { stroke: #ff9a6b; }
  svg .serp { stroke: #5cc8ff; stroke-width: 2.5; fill: none; opacity: .85; }
  svg .vanne path { fill: var(--orange); } svg .vanne line { stroke: var(--orange); stroke-width: 2.5; }
  svg .dj { fill: var(--card2); stroke: var(--line); } svg .dj.gen { stroke: var(--ice); stroke-width: 1.5; }
  svg .levier.on { fill: var(--vert); } svg .levier.off { fill: var(--rouge); }
  svg .testbtn { fill: var(--orange); }
  svg .hp { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
  svg .cable { stroke: var(--mut); stroke-width: 3; fill: none; } svg .cable.xlr { stroke: #c38bff; } svg .cable.spk { stroke: var(--orange); }
  svg .pin { fill: var(--ice); } svg .fleche { stroke: var(--ice); stroke-width: 2.5; fill: none; }

  .appel { margin-top: 22px; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #0f3f78, #0b2c57); border: 1px solid #2a5fa0; }
  .appel p { margin: 0 0 12px; font-size: 15px; }
  .appel .btns { display: flex; flex-direction: column; gap: 8px; }
  .gros small { font-weight: 500; font-size: 13px; opacity: .7; white-space: nowrap; }
  .gros { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: 14px; font-weight: 700; font-size: 16px; background: #fff; color: #062048; width: 100%; }
  .gros.sec { background: var(--rouge); color: #fff; }
  .gros.cl { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; height: 46px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--mut); }

  /* Feuilles du bas + lecteur vidéo */
  .voile { position: fixed; inset: 0; background: rgba(1,8,18,.72); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .voile.ouvert { opacity: 1; pointer-events: auto; }
  .feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--bg2); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + var(--safe-b)); transform: translateY(105%); transition: transform .25s ease; max-width: 560px; margin: 0 auto; }
  .feuille.ouvert { transform: none; }
  .feuille .poignee { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 12px; }
  .feuille h3 { margin: 0 0 4px; font-size: 18px; }
  .feuille p { margin: 0 0 14px; color: var(--mut); font-size: 14px; }
  .feuille .btns { display: flex; flex-direction: column; gap: 8px; }
  .choix-site { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-align: left; width: 100%; }
  .choix-site.actif { border-color: var(--ice); }
  .choix-site b { display: block; } .choix-site small { color: var(--mut); font-size: 12px; }
  .lecteur { position: fixed; inset: 0; z-index: 70; background: #000; display: none; flex-direction: column; }
  .lecteur.ouvert { display: flex; }
  .lecteur .barre { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + var(--safe-t)) 16px 10px; gap: 12px; }
  .lecteur .barre b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lecteur .barre button { font-size: 15px; color: var(--ice); flex: none; }
  .lecteur .cadre { flex: 1; display: grid; place-items: center; }
  .lecteur iframe { width: 100%; aspect-ratio: 16/9; border: 0; }
  .lecteur .horsligne { color: var(--mut); padding: 24px; text-align: center; }

  .toast { position: fixed; left: 50%; top: calc(14px + var(--safe-t)); transform: translate(-50%, -140%); z-index: 80; background: #fff; color: #062048; border-radius: 14px; padding: 10px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: flex; align-items: center; gap: 10px; transition: transform .35s cubic-bezier(.2,1.3,.4,1); white-space: nowrap; max-width: calc(100vw - 32px); }
  .toast.ouvert { transform: translate(-50%, 0); }
  .toast small { display: block; font-weight: 400; color: #4b6185; font-size: 12px; }

  footer { margin-top: 30px; text-align: center; color: #5f7699; font-size: 12px; line-height: 1.6; }
  footer button { color: var(--ice); text-decoration: underline; font-size: 12px; }
  .cache { display: none !important; }
  @media (min-width: 520px) { .tuile { min-height: 132px; } }
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <img src="/synerglace/logo.png" alt="Synerglace" id="logo">
    <button class="site-btn" id="siteBtn" aria-label="Changer de patinoire">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span id="siteNomCourt"></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="vue"></main>

<div class="voile" id="voile"></div>
<div class="feuille" id="feuille" role="dialog" aria-modal="true"><div class="poignee"></div><div id="feuilleCorps"></div></div>
<div class="lecteur" id="lecteur" role="dialog" aria-modal="true">
  <div class="barre"><b id="lecteurTitre"></b><button id="lecteurFermer">Fermer ✕</button></div>
  <div class="cadre" id="lecteurCadre"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/synerglace/fiches.js"></script>
<script src="/synerglace/schemas.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const vue = $("#vue");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const telAff = t => t.replace("+33", "0").replace(/(\d)(?=(\d{2})+$)/g, "$1 ");
  const NIV = { rouge: "Urgent · sécurité", orange: "À traiter vite", vert: "Routine" };
  const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';

  // ---------- Patinoire (badge / QR) ----------
  const params = new URLSearchParams(location.search);
  let siteId = params.get("site");
  try { if (!SITES[siteId]) siteId = localStorage.getItem("sg-site"); } catch (e) {}
  if (!SITES[siteId]) siteId = "place-armes";
  const via = params.get("via");
  function setSite(id, garder) {
    siteId = id;
    try { localStorage.setItem("sg-site", id); } catch (e) {}
    $("#siteNomCourt").textContent = SITES[id].nom;
    const u = new URL(location.href);
    u.searchParams.set("site", id); u.searchParams.delete("via");
    history.replaceState(history.state, "", u.pathname + u.search + location.hash);
    if (!garder) rendre();
  }
  setSite(siteId, true);

  // ---------- Index de recherche ----------
  const IDX = FICHES.map(f => ({
    f,
    titre: norm(f.titre),
    mots: norm(f.mots + " " + CATS[f.cat].nom),
    corps: norm([f.avant, ...f.etapes].join(" ")),
  }));
  const VIDES = new Set("la le les de des du un une en et est au aux ne pas plus il elle on ca ce cet cette qui que mon ma ya trop tres sur".split(" "));
  function chercher(q) {
    const toks = norm(q).split(" ").filter(t => t.length > 1 && !VIDES.has(t));
    if (!toks.length) return [];
    const res = [];
    for (const x of IDX) {
      let score = 0, touches = 0;
      for (const t of toks) {
        const re = new RegExp("(^| )" + t);
        let s = 0;
        if (re.test(x.titre)) s = 6; else if (re.test(x.mots)) s = 4; else if (re.test(x.corps)) s = 1;
        if (s) touches++;
        score += s;
      }
      if (x.titre.includes(norm(q))) score += 8;
      if (touches) res.push({ f: x.f, score: score * (touches / toks.length) });
    }
    res.sort((a, b) => b.score - a.score);
    const max = res.length ? res[0].score : 0;
    return res.filter(r => r.score >= 2 && r.score >= max * .4).slice(0, 8).map(r => r.f);
  }

  // ---------- Rendus ----------
  const ligneFiche = f => `<button class="ligne" data-fiche="${f.id}">
      <span class="pastille p-${f.niveau}"></span>
      <span class="t"><b>${esc(f.titre)}</b><small>${CATS[f.cat].ico} ${CATS[f.cat].nom} · ${f.duree}</small></span>${chev}</button>`;

  function boutonAppel(cle, cls) {
    const c = CONTACTS[cle];
    return `<a class="gros ${cls || ""}" href="tel:${c.tel}"><span>📞 ${esc(c.label)}</span><small>${telAff(c.tel)}</small></a>`;
  }

  function accueil() {
    const s = SITES[siteId];
    vue.innerHTML = `
      <section class="hero">
        <div class="etq">Assistance patinoire</div>
        <h1>${esc(s.nom)}</h1>
        <p>${esc(s.adr)} · ${esc(s.piste)}</p>
        <div class="etat"><i></i>Fiches disponibles même sans réseau</div>
      </section>

      <h2>Urgences · appel direct</h2>
      <div class="urg">
        <a class="astr" href="tel:${CONTACTS.astreinte.tel}"><span class="ico">❄️</span><b>Astreinte Synerglace</b><small>${CONTACTS.astreinte.qui}</small></a>
        <a href="tel:${CONTACTS.elec.tel}"><span class="ico">⚡</span><b>Électricien</b><small>${CONTACTS.elec.qui}</small></a>
        <a href="tel:${CONTACTS.mairie.tel}"><span class="ico">🏛️</span><b>Mairie de Belfort</b><small>${CONTACTS.mairie.qui}</small></a>
        <button class="sec" id="btnSecours"><span class="ico">🚑</span><b>Secours</b><small>112 · 18 · 15</small></button>
      </div>

      <h2>Quel est le problème ?</h2>
      <div class="cherche" id="cherche">
        <svg class="loupe" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="ex. glace trop molle, plus de son…">
        <button class="eff" id="eff" aria-label="Effacer">×</button>
      </div>
      <div class="chips" id="chips">${SUGGESTIONS.map(s => `<button data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div id="resultats" class="liste" style="margin-top:10px"></div>

      <div id="blocThemes">
        <h2>Fiches réflexes par thème</h2>
        <div class="tuiles">${Object.entries(CATS).map(([k, c]) => `
          <button class="tuile" style="--c:${c.coul}" data-cat="${k}">
            <span class="ico">${c.ico}</span><span class="nb">${FICHES.filter(f => f.cat === k).length} fiches</span>
            <b>${c.nom}</b><small>${c.sous}</small></button>`).join("")}
        </div>

        <h2>Urgent · sécurité</h2>
        <div class="liste">${FICHES.filter(f => f.niveau === "rouge").map(ligneFiche).join("")}</div>

        <h2>Ce site</h2>
        <details class="reperes"><summary>Repères de la patinoire<span class="pl">＋</span></summary>
          <dl>${s.reperes.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>
        </details>
      </div>
      ${pied()}`;

    const q = $("#q"), res = $("#resultats"), cherche = $("#cherche"), themes = $("#blocThemes");
    function maj() {
      const v = q.value.trim();
      cherche.classList.toggle("rempli", !!v);
      themes.classList.toggle("cache", !!v);
      if (!v) { res.innerHTML = ""; return; }
      const r = chercher(v);
      res.innerHTML = r.length ? r.map(ligneFiche).join("")
        : `<div class="vide">Rien trouvé pour « ${esc(v)} ». Essayez un autre mot, ou appelez l'astreinte.</div>${boutonAppel("astreinte")}`;
    }
    q.addEventListener("input", maj);
    q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
    $("#eff").onclick = () => { q.value = ""; maj(); q.focus(); };
    $("#chips").onclick = e => { const b = e.target.closest("[data-sug]"); if (b) { q.value = b.dataset.sug; maj(); } };
    $("#btnSecours").onclick = secours;
    if (memoQ) { q.value = memoQ; maj(); }
  }

  function categorie(k) {
    const c = CATS[k];
    vue.innerHTML = `
      ${retour()}
      <section class="hero"><div class="etq">${c.ico} Fiches réflexes</div><h1>${c.nom}</h1><p>${c.sous}</p></section>
      <div class="liste">${FICHES.filter(f => f.cat === k).map(ligneFiche).join("")}</div>
      ${pied()}`;
  }

  function fiche(id) {
    const f = FICHES.find(x => x.id === id);
    if (!f) return go("");
    const c = CATS[f.cat], sch = f.schema && SCHEMAS[f.schema];
    vue.innerHTML = `
      ${retour()}
      <article class="fiche">
        <span class="badge-niv n-${f.niveau}">● ${NIV[f.niveau]}</span>
        <h1>${esc(f.titre)}</h1>
        <div class="meta">${c.ico} ${c.nom} · ${f.duree} · ${esc(SITES[siteId].nom)}</div>
        <div class="avant ${f.niveau === "rouge" ? "rouge" : ""}"><span>⚠️</span><span>${esc(f.avant)}</span></div>

        <h2>Étapes</h2>
        <div class="progres"><i id="prog"></i></div>
        <ol class="etapes" id="etapes">${f.etapes.map(e => `<li><button>${esc(e)}</button></li>`).join("")}</ol>

        ${f.video || sch ? `<h2>${f.video && sch ? "Schéma & vidéo" : sch ? "Schéma" : "Vidéo"}</h2><div class="media">
          ${sch ? `<figure class="schema">${sch.svg}<figcaption><b>${esc(sch.titre)}</b>${esc(sch.legende)}</figcaption></figure>` : ""}
          ${f.video ? `<button class="video" data-video="${f.video.id}" data-titre="${esc(f.video.titre)}">
            <span class="play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
            <span><b>${esc(f.video.titre)}</b><small>Tutoriel vidéo · nécessite du réseau</small></span></button>` : ""}
        </div>` : ""}

        <div class="appel">
          <p>Toujours en panne ? Appelez si <b>${esc(f.appelSi)}</b>.</p>
          <div class="btns">${f.appel.map(k => boutonAppel(k)).join("")}</div>
        </div>
        <div class="actions">
          <button id="raz">↺ Recommencer</button>
          <button id="partager">↗ Envoyer la fiche</button>
        </div>
      </article>
      ${pied()}`;

    const lis = [...document.querySelectorAll("#etapes li")];
    const prog = () => { $("#prog").style.width = (100 * lis.filter(l => l.classList.contains("fait")).length / lis.length) + "%"; };
    $("#etapes").onclick = e => { const li = e.target.closest("li"); if (li) { li.classList.toggle("fait"); prog(); } };
    $("#raz").onclick = () => { lis.forEach(l => l.classList.remove("fait")); prog(); };
    $("#partager").onclick = async () => {
      const url = location.origin + location.pathname + "?site=" + siteId + "#/fiche/" + f.id;
      const txt = `${f.titre} · ${SITES[siteId].nom}`;
      try {
        if (navigator.share) await navigator.share({ title: txt, url });
        else { await navigator.clipboard.writeText(url); toast("Lien copié", txt); }
      } catch (e) {}
    };
  }

  const retour = () => `<button class="retour" data-retour>‹ Retour</button>`;
  const pied = () => `<footer>Démonstration iDkom pour Synerglace · contenu indicatif<br>
      <button data-install>Ajouter à l'écran d'accueil</button></footer>`;

  // ---------- Feuilles ----------
  function ouvrirFeuille(html) {
    $("#feuilleCorps").innerHTML = html;
    $("#voile").classList.add("ouvert"); $("#feuille").classList.add("ouvert");
  }
  function fermerFeuille() { $("#voile").classList.remove("ouvert"); $("#feuille").classList.remove("ouvert"); }
  $("#voile").onclick = fermerFeuille;

  function secours() {
    ouvrirFeuille(`<h3>🚑 Secours</h3><p>Blessé, malaise, incendie : appelez les secours, puis l'astreinte.</p>
      <div class="btns">
        <a class="gros sec" href="tel:112"><span>📞 112</span><small>Urgences</small></a>
        <a class="gros cl" href="tel:18"><span>📞 18</span><small>Pompiers</small></a>
        <a class="gros cl" href="tel:15"><span>📞 15</span><small>SAMU</small></a>
        ${boutonAppel("astreinte", "cl")}
      </div>`);
  }
  function choixSite() {
    ouvrirFeuille(`<h3>Quelle patinoire ?</h3><p>Chaque badge ouvre directement sa patinoire.</p>
      <div class="btns">${Object.entries(SITES).map(([k, s]) => `
        <button class="choix-site ${k === siteId ? "actif" : ""}" data-site="${k}"><span style="font-size:22px">⛸️</span>
        <span><b>${esc(s.nom)}</b><small>${esc(s.piste)}</small></span></button>`).join("")}</div>`);
  }
  $("#siteBtn").onclick = choixSite;
  $("#feuilleCorps").onclick = e => {
    const b = e.target.closest("[data-site]");
    if (b) { fermerFeuille(); setSite(b.dataset.site); toast("Patinoire " + SITES[b.dataset.site].nom, "Fiches et repères du site"); }
  };

  // ---------- Vidéo ----------
  function video(id, titre) {
    $("#lecteurTitre").textContent = titre;
    $("#lecteurCadre").innerHTML = navigator.onLine
      ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`
      : `<div class="horsligne">Pas de réseau : la vidéo sera disponible dès que la connexion revient.<br>Les étapes de la fiche restent utilisables.</div>`;
    $("#lecteur").classList.add("ouvert");
  }
  $("#lecteurFermer").onclick = () => { $("#lecteur").classList.remove("ouvert"); $("#lecteurCadre").innerHTML = ""; };

  // ---------- Toast ----------
  let tt;
  function toast(a, b) {
    const t = $("#toast");
    t.innerHTML = `<span style="font-size:20px">✅</span><span>${esc(a)}${b ? `<small>${esc(b)}</small>` : ""}</span>`;
    t.classList.add("ouvert"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("ouvert"), 2800);
  }

  // ---------- Navigation ----------
  let memoQ = "";
  function go(h) { location.hash = h ? "#/" + h : ""; }
  vue.addEventListener("click", e => {
    const fi = e.target.closest("[data-fiche]"), ca = e.target.closest("[data-cat]"), vi = e.target.closest("[data-video]");
    if (fi) { const q = $("#q"); memoQ = q ? q.value : memoQ; go("fiche/" + fi.dataset.fiche); }
    else if (ca) { memoQ = ""; go("cat/" + ca.dataset.cat); }
    else if (vi) video(vi.dataset.video, vi.dataset.titre);
    else if (e.target.closest("[data-retour]")) { history.length > 1 && location.hash ? history.back() : go(""); }
    else if (e.target.closest("[data-install]")) installer();
  });
  function rendre() {
    const [, type, id] = (location.hash.match(/^#\/(\w+)\/([\w-]+)/) || []);
    if (type === "fiche") fiche(id);
    else if (type === "cat" && CATS[id]) categorie(id);
    else accueil();
  }
  window.addEventListener("hashchange", () => { rendre(); window.scrollTo(0, 0); });
  rendre();

  if (via === "nfc" || via === "qr")
    setTimeout(() => toast(via === "nfc" ? "Badge NFC reconnu" : "QR code scanné", "Patinoire " + SITES[siteId].nom), 350);

  // ---------- Écran d'accueil + hors ligne ----------
  let invite = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); invite = e; });
  function installer() {
    if (invite) { invite.prompt(); invite = null; return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    ouvrirFeuille(`<h3>Ajouter à l'écran d'accueil</h3>
      <p>${ios ? "Dans Safari : bouton Partager <b>↑</b>, puis « Sur l'écran d'accueil »." : "Menu du navigateur <b>⋮</b>, puis « Ajouter à l'écran d'accueil »."}
      L'appli s'ouvre alors comme une application et ses fiches restent consultables sans réseau.</p>
      <div class="btns"><button class="gros cl" style="justify-content:center" onclick="document.getElementById('voile').click()">Compris</button></div>`);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/synerglace-sw.js", { scope: "/synerglace" }).catch(() => {});
})();
</script>
</body>
</html>
